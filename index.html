<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdulaziz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#f7fdff;
    --bg-bottom:#e4f8fb;
    --card:#ffffff;
    --ink:#0e2a33;
    --ink-soft:#4f7079;
    --cyan:#22c3dd;
    --cyan-deep:#0fa6c2;
    --cyan-pale:#dff8fb;
    --line:#d7f0f4;
    --shadow: 0 30px 60px -25px rgba(15,166,194,.35);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Cairo','Outfit',sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, #d3f4f8 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 10%, #e9fbfd 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .page{
    width:100%;
    max-width:1040px;
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:56px;
    align-items:center;
  }

  /* -------- left intro column -------- */
  .intro{
    padding-inline-start:8px;
  }
  .kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    color:var(--cyan-deep);
    background:var(--cyan-pale);
    border:1px solid var(--line);
    padding:6px 14px 6px 10px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .kicker span.dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 0 4px rgba(34,195,221,.18);
  }
  .intro h1{
    font-family:'Outfit',sans-serif;
    font-size:clamp(36px,4.2vw,54px);
    line-height:1.08;
    font-weight:700;
    margin:0 0 18px;
    letter-spacing:-0.01em;
  }
  .intro h1 em{
    font-style:normal;
    color:var(--cyan-deep);
  }
  .intro p{
    font-size:17px;
    line-height:1.85;
    color:var(--ink-soft);
    max-width:44ch;
    margin:0 0 30px;
  }
  .intro-links{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .intro-links a{
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    padding:12px 22px;
    border-radius:12px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn-solid{
    background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));
    color:#fff;
    box-shadow:0 14px 26px -12px rgba(15,166,194,.55);
  }
  .btn-solid:hover{ transform:translateY(-2px); }
  .btn-ghost{
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
  }
  .btn-ghost:hover{ border-color:var(--cyan); transform:translateY(-2px); }

  /* -------- right profile card -------- */
  .card-wrap{
    display:flex;
    justify-content:center;
  }
  .card{
    position:relative;
    width:100%;
    max-width:360px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:26px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .cover{
    height:118px;
    background:
      radial-gradient(120% 160% at 20% 0%, #baf1f8 0%, transparent 55%),
      linear-gradient(120deg,#4fd7ea,#0fa6c2 65%);
    position:relative;
  }
  .cover svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:.55;
  }

  .avatar{
    width:88px;
    height:88px;
    border-radius:22px;
    background:linear-gradient(160deg,#ffffff,#eafcff);
    border:4px solid #fff;
    box-shadow:0 10px 24px -10px rgba(15,166,194,.5);
    margin:-46px auto 0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Outfit',sans-serif;
    font-weight:700;
    font-size:30px;
    color:var(--cyan-deep);
  }
  .status{
    position:absolute;
    bottom:2px;
    inset-inline-end:2px;
    width:16px;height:16px;
    border-radius:50%;
    background:#3ee08b;
    border:3px solid #fff;
  }

  .card-body{
    padding:14px 26px 26px;
    text-align:center;
  }
  .name{
    font-family:'Outfit',sans-serif;
    font-size:21px;
    font-weight:700;
    margin:8px 0 2px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .name svg{ width:16px; height:16px; }
  .role{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }

  .badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
  }
  .badges span{
    width:30px;height:30px;
    border-radius:9px;
    background:var(--cyan-pale);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cyan-deep);
  }
  .badges svg{ width:15px;height:15px; }

  .links{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:18px;
    text-align:start;
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px 14px;
    background:#f6fdfe;
    border:1px solid var(--line);
    border-radius:13px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .link-row:hover{
    border-color:var(--cyan);
    background:#eefcfe;
  }
  .link-row .ic{
    width:30px;height:30px;
    min-width:30px;
    border-radius:9px;
    background:var(--cyan-pale);
    color:var(--cyan-deep);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-row .ic svg{ width:15px;height:15px; }
  .link-row .meta{
    margin-inline-start:auto;
    font-size:11.5px;
    font-weight:500;
    color:var(--ink-soft);
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:10px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .socials a{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cyan-deep);
    background:var(--cyan-pale);
    transition:transform .15s ease, background .15s ease;
  }
  .socials a:hover{ transform:translateY(-2px); background:#c9f2f7; }
  .socials svg{ width:16px;height:16px; }

  @media (max-width:880px){
    .page{ grid-template-columns:1fr; gap:40px; }
    .intro{ text-align:center; padding:0; }
    .intro p{ margin-inline:auto; }
    .intro-links{ justify-content:center; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="intro">
    <div class="kicker"><span class="dot"></span>الصفحة الشخصية</div>
    <h1>عبدالعزيز، <em>مرحبًا بك في صفحتي</em></h1>
    <p>هذي صفحتي الشخصية اللي تجمع كل روابطي وحساباتي في مكان واحد، تصفح واختر اللي يناسبك.</p>
    <div class="intro-links">
      <a href="#links" class="btn-solid">عرض روابطي</a>
      <a href="#socials" class="btn-ghost">تواصل معي</a>
    </div>
  </div>

  <div class="card-wrap">
    <div class="card">
      <div class="cover">
        <svg viewBox="0 0 360 118" preserveAspectRatio="none">
          <path d="M0,80 C90,40 270,110 360,60 L360,118 L0,118 Z" fill="#ffffff" fill-opacity="0.25"/>
        </svg>
      </div>

      <div class="avatar">
        AZ
        <span class="status"></span>
      </div>

      <div class="card-body">
        <div class="name">
          Abdulaziz
          <svg viewBox="0 0 24 24" fill="none" stroke="#0fa6c2" stroke-width="2"><path d="M12 2l2.4 6.5L21 9l-5.2 4.4L17.5 21 12 17l-5.5 4 1.7-7.6L3 9l6.6-.5L12 2z"/></svg>
        </div>
        <p class="role">مطوّر واجهات · Riyadh</p>

        <div class="badges">
          <span title="مطور"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span>
          <span title="عضو مميز"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg></span>
          <span title="موثّق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span>
        </div>

        <div id="links" class="links">
          <a class="link-row" href="#">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
            أعمالي
            <span class="meta">portfolio</span>
          </a>
          <a class="link-row" href="#">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></span>
            متجري
            <span class="meta">store</span>
          </a>
          <a class="link-row" href="#">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.3 4.7A17 17 0 0 0 15.8 3l-.4.8a13 13 0 0 1 3.7 1.5"/><path d="M3.7 4.7A17 17 0 0 1 8.2 3l.4.8A13 13 0 0 0 4.9 5.3"/><rect x="4" y="6" width="16" height="12" rx="4"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></svg></span>
            سيرفر الديسكورد
            <span class="meta">discord</span>
          </a>
        </div>

        <div id="socials" class="socials">
          <a href="#" title="Discord"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.7A17 17 0 0 0 15.8 3l-.4.8a13 13 0 0 1 3.7 1.5c-1.5-.8-3.2-1.3-5-1.5-1.8-.2-3.7 0-5.5.6-.4.1-.9.3-1.3.5l-.4-.8A17 17 0 0 0 3.7 4.7C1.6 8 1 11.3 1.2 14.6a17 17 0 0 0 5.2 2.6l.7-1.1a11 11 0 0 1-1.7-.8l.4-.3c3.3 1.5 6.9 1.5 10.2 0l.4.3a11 11 0 0 1-1.7.8l.7 1.1a17 17 0 0 0 5.2-2.6C23 11.1 22.2 7.8 20.3 4.7zM8.7 13.4c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg></a>
          <a href="#" title="Spotify"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg></a>
          <a href="#" title="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.3-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.6s.9-.3 2.9 1a10 10 0 0 1 5.2 0c2-1.3 2.9-1 2.9-1a3.6 3.6 0 0 1 .1 2.6 3.9 3.9 0 0 1 1 2.7c0 3.9-2.3 4.7-4.6 5 .4.3.7 1 .7 2v2.9c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg></a>
          <a href="#" title="X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3h3.2l-7 8 8.2 10h-6.4l-5-6.5L4.5 21H1.3l7.5-8.6L1 3h6.5l4.5 6 5.5-6z"/></svg></a>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
